services:
  mongodb:
    image: mongo:7
    container_name: pharmacy-mongodb
    restart: unless-stopped
    environment:
      MONGO_INITDB_ROOT_USERNAME: ${MONGO_USERNAME:-admin}
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_PASSWORD:-changeme}
      MONGO_INITDB_DATABASE: pharmacy
    ports:
      - "27017:27017"
    volumes:
      - mongodb_data:/data/db
    networks:
      - pharmacy-network

  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: pharmacy-app
    restart: unless-stopped
    ports:
      - "${PORT:-5000}:5000"
    environment:
      - NODE_ENV=production
      - PORT=5000
      - MONGODB_URI=mongodb://${MONGO_USERNAME:-admin}:${MONGO_PASSWORD:-changeme}@mongodb:27017/pharmacy?authSource=admin
      - JWT_SECRET=${JWT_SECRET}
      - JWT_REFRESH_SECRET=${JWT_REFRESH_SECRET}
      - JWT_EXPIRE=${JWT_EXPIRE:-1h}
      - JWT_REFRESH_EXPIRE=${JWT_REFRESH_EXPIRE:-7d}
      - CLIENT_URL=${CLIENT_URL:-http://localhost:5000}
    depends_on:
      - mongodb
    volumes:
      - uploads_data:/app/server/uploads
    networks:
      - pharmacy-network

volumes:
  mongodb_data:
  uploads_data:

networks:
  pharmacy-network:
    driver: bridge
